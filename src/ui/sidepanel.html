<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keimenon Lite</title>
  <link rel="icon" href="../../favicon/keimenon-favicon-16.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">

    <div class="header-group" id="headerGroup">
        <div class="scan-line"></div>
        

        <!-- Row 2: Control Icons -->
        <div class="controls-row">
             <div id="statusBadge" class="status-badge">Ready</div>
             
             <!-- Scan -->
             <button id="quickScanBtn" class="icon-btn hidden" title="Scan Full Chat">
                 <div class="svg-icon icon-scan"></div>
             </button>

             <!-- Refresh -->
             <button id="quickRefreshBtn" class="icon-btn" title="Refresh Page">
                 <div class="svg-icon icon-refresh"></div>
             </button>
             
             <!-- Separator -->
             <div class="separator-vertical"></div>

             <div style="flex: 1;"></div>

             <!-- 3-Way Author Toggle (Segmented Button) -->
             <div class="segmented-btn-group" id="authorToggleGroup">
                 <div class="gliding-pill"></div>
                 <button class="segment-btn active" data-value="user" title="Human Only">
                     <div class="svg-icon icon-user large"></div>
                 </button>
                 <button class="segment-btn" data-value="both" title="Both">
                     <div class="svg-icon icon-both large"></div>
                 </button>
                 <button class="segment-btn" data-value="assistant" title="AI Only">
                     <div class="svg-icon icon-bot large"></div>
                 </button>
             </div>

             <div style="flex: 1;"></div>
             
             <!-- Separator -->
             <div class="separator-vertical"></div>

             <!-- Copy -->
             <button id="copyAllBtn" class="icon-btn" title="Copy Selected">
                 <div class="svg-icon icon-copy"></div>
             </button>

             <!-- Menu Key -->
             <button id="menuBtn" class="icon-btn" title="More Options">
                <div class="svg-icon icon-more"></div>
             </button>
         </div>

        <div id="scanProgress" class="scan-progress" style="display: none;">
            <div class="scan-progress-text">
                <div class="scan-dot"></div>
                <span>Scanning... <span id="scanLog"></span></span>
            </div>
            <button id="stopScanBtn" class="action-btn-small">Stop</button>
        </div>

        <!-- Row 3: Search & Actions -->
        <div class="search-row" style="display: flex; gap: 8px; align-items: center;">
            <!-- Select All Action -->
            <button id="selectAllActionBtn" class="icon-btn" title="Select All">
                <div id="selectAllIcon" class="svg-icon icon-check-empty"></div>
            </button>

            <fieldset class="text-field" style="flex: 1;">
                <legend class="text-field-legend">Search</legend>
                <div class="svg-icon icon-search search-icon"></div>
                <input type="text" id="searchInput" class="search-input" placeholder="Search prompts..." style="border:none; padding: 0; background: transparent; height: 100%;">
            </fieldset>

            <!-- Filter Action -->
            <button id="filterBtn" class="icon-btn" title="Filters">
                 <div class="svg-icon icon-filter"></div>
            </button>

            <!-- Visibility Action -->
            <button id="visibilityActionBtn" class="icon-btn" title="Toggle Hidden Messages">
                <div id="visibilityIcon" class="svg-icon icon-visibility-on"></div>
            </button>
        </div>

        <!-- Row 4: Stats Grid (Read Only) -->
        <div id="statsGrid" class="stats-grid">
            <!-- Selected Stat (Full Width) -->
            <fieldset class="text-field" id="statSelected" title="Selected Count" style="grid-column: 1 / -1;">
                <legend class="text-field-legend">Selected</legend>
                <div class="text-field-content">
                    <span id="selectedCountValue" class="stat-value">0 / 0 / 0</span>
                </div>
            </fieldset>
            <fieldset class="text-field" title="Character Count">
                <legend class="text-field-legend">Characters</legend>
                <span id="statCharsVal" class="stat-value">0 / 0 / 0</span>
            </fieldset>
            <fieldset class="text-field" title="Token Count">
                <legend class="text-field-legend">Tokens</legend>
                <span id="statTokensVal" class="stat-value">0 / 0 / 0</span>
            </fieldset>
        </div>
    </div>
    
    <!-- Actions Dropdown -->
    <div id="actionsMenu" class="dropdown-menu">
        <button class="menu-item" id="menuAuthAction">Sign Out</button>
        <div class="menu-separator"></div>
        <label class="menu-item" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="analyticsToggle" checked> 
            <span style="flex: 1">Analytics</span>
        </label>
        <div class="menu-separator"></div>
        <button class="menu-item" id="menuPrivacyBtn">Privacy Policy</button>
        <button class="menu-item" id="menuContactBtn">Contact</button>
        <button class="menu-item" id="menuDonateBtn">Donate</button>
        
        <div class="menu-separator"></div>
        <div id="versionDisplay" class="version-label" style="text-align: center; padding: 4px; opacity: 0.5;">v...</div>
    </div>
    
    <!-- Filter Sheet -->
    <div id="filterOverlay" class="overlay"></div>
    <div id="filterSheet" class="bottom-sheet">
        <div class="sheet-header">
            <button id="clearFilterBtn" class="action-btn-text" style="visibility: hidden;">Clear</button>
            <span class="sheet-title">Filters</span>
            <button id="closeFilterBtn" class="action-btn">Done</button>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <!-- Min Length Input -->
            <fieldset class="text-field" style="flex: 1;">
                <legend class="text-field-legend">Min Length</legend>
                <input type="number" id="minLenInput" value="0" min="0" 
                       style="border:none; padding: 0; background: transparent; height: 100%; width: 100%; font-family: inherit;">
            </fieldset>

            <!-- Sort Toggle Button -->
            <button id="sortToggleBtn" class="icon-btn" title="Sort Order: Original">
                <div id="sortIcon" class="svg-icon icon-arrow-indeterminate"></div>
            </button>
        </div>
    </div>

    <div id="messageList" class="message-list">
      <div class="empty-state">No messages extracted yet.</div>
    </div>
    
    <div id="loginScreen" class="login-screen hidden">
        <div class="login-icon">K</div>
        <div class="title" style="margin-bottom: 8px;">Welcome to Keimenon</div>
        <div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">
            Sign in to start extracting prompts.
        </div>
        <button id="googleSignInBtn" class="google-btn">
            Sign in with Google
        </button>
    </div>
    <!-- Privacy Sheet -->
    <div id="privacySheet" class="bottom-sheet">
        <div class="sheet-header">
            <div style="width: 36px;"></div> <!-- Spacer -->
            <span class="sheet-title">Privacy Policy</span>
            <button id="closePrivacyBtn" class="action-btn">Done</button>
        </div>
        <div id="privacyContent" class="markdown-content" style="max-height: 300px; overflow-y: auto;">
            Loading...
        </div>
    </div>

    <!-- Contact Sheet -->
    <div id="contactSheet" class="bottom-sheet">
        <div class="sheet-header">
            <div style="width: 36px;"></div>
            <span class="sheet-title">Contact</span>
            <button id="closeContactBtn" class="action-btn">Close</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <fieldset class="text-field">
                <legend class="text-field-legend">Name</legend>
                <input type="text" placeholder="Your Name" style="border:none; width: 100%; background: transparent; color: inherit;">
            </fieldset>
            <fieldset class="text-field">
                <legend class="text-field-legend">Message</legend>
                <input type="text" placeholder="How can we help?" style="border:none; width: 100%; background: transparent; color: inherit;">
            </fieldset>
             <button class="action-btn" style="background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); justify-content: center; width: 100%; margin-top: 8px;">
                Send Message
            </button>
        </div>
    </div>

    <!-- Donate Sheet -->
    <div id="donateSheet" class="bottom-sheet">
        <div class="sheet-header">
            <div style="width: 36px;"></div>
            <span class="sheet-title">Donate</span>
            <button id="closeDonateBtn" class="action-btn">Close</button>
        </div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 16px; padding: 16px 0;">
            <div style="font-size: 48px;">☕</div>
            <div style="color: var(--md-sys-color-on-surface-variant);">
                Support the development of Keimenon Lite.
            </div>
            <button class="action-btn" style="background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); justify-content: center; width: 100%;">
                Buy me a Coffee
            </button>
        </div>
    </div>
    
  </div>
  <!-- Mock Injection for Dev Preview -->
  <!-- Mock Injection moved to sidepanel.js -->
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
