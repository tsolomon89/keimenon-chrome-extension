<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keimenon Lite</title>
  <link rel="icon" href="../../favicon/keimenon-favicon-16.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">



    <div class="header-group" id="headerGroup">
        <div class="scan-line"></div>
        

        <!-- Row 2: Control Icons -->
        <div class="controls-row">
             <div id="statusBadge" class="status-badge">Ready</div>
             
             <!-- Scan -->
             <button id="quickScanBtn" class="icon-btn hidden" title="Scan Full Chat">
                 <div class="svg-icon icon-scan"></div>
             </button>

             <!-- --------- -->
             <!-- Separator -->
             <!-- --------- -->
             <div class="separator-vertical"></div>

             <div style="flex: 1;"></div>

             <!-- 3-Way Author Toggle (Segmented Button) -->
             <!-- 3-Way Author Toggle (New Theme System) -->
             <div class="toggle-track" id="authorToggleGroup" data-active="both">
                 <div class="slider"></div>
                 <button class="toggle-btn" data-value="user" title="Human Only">
                     <div class="svg-icon icon-user"></div>
                 </button>
                 <button class="toggle-btn active" data-value="both" title="Both">
                     <div class="svg-icon icon-both"></div>
                 </button>
                 <button class="toggle-btn" data-value="assistant" title="AI Only">
                     <div class="svg-icon icon-bot"></div>
                 </button>
             </div>

             <div style="flex: 1;"></div>

             <!-- --------- -->
             <!-- Separator -->
             <!-- --------- --> 
             <div class="separator-vertical"></div>

             <!-- Refresh -->
             <button id="quickRefreshBtn" class="icon-btn" title="Refresh Page">
                 <div class="svg-icon icon-refresh"></div>
             </button>

             <!-- Copy -->
             <button id="copyAllBtn" class="icon-btn" title="Copy Selected">
                 <div class="svg-icon icon-copy"></div>
             </button>

             <!-- Menu Key -->
             <button id="menuBtn" class="icon-btn" title="More Options">
                <div class="svg-icon icon-more"></div>
             </button>
         </div>


        <!-- Row 3: Search & Actions -->
        <div class="search-row" style="display: flex; gap: 8px; align-items: center;">
            <!-- Select All Action -->
            <button id="selectAllActionBtn" class="icon-btn" title="Select All">
                <div id="selectAllIcon" class="svg-icon icon-check-empty"></div>
            </button>

            <div class="text-field has-icon" style="flex: 1;">
                <input type="text" id="searchInput" class="search-input" placeholder=" ">
                <label for="searchInput">Search prompts...</label>
                <div class="svg-icon icon-search search-icon"></div>
            </div>

            <!-- Filter Action -->
            <button id="filterBtn" class="icon-btn" title="Filters">
                 <div class="svg-icon icon-filter"></div>
            </button>

            <!-- Visibility Action -->
            <button id="visibilityActionBtn" class="icon-btn" title="Toggle Hidden Messages">
                <div id="visibilityIcon" class="svg-icon icon-visibility-on"></div>
            </button>
        </div>

        <!-- Row 4: Stats Grid (Read Only) -->
        <div id="statsGrid" class="stats-grid">
            <!-- Selected Stat (Full Width) -->
            <!-- Selected Stat (Full Width) -->
            <div class="text-field force-active" id="statSelected" title="Selected Count" style="grid-column: 1 / -1;">
                <input type="text" readonly value="0 / 0 / 0" id="selectedCountValue" class="stat-value">
                <label>Selected</label>
            </div>
            <div class="text-field force-active" title="Character Count">
                <input type="text" readonly value="0 / 0 / 0" id="statCharsVal" class="stat-value">
                <label>Characters</label>
            </div>
            <div class="text-field force-active" title="Token Count">
                <input type="text" readonly value="0 / 0 / 0" id="statTokensVal" class="stat-value">
                <label>Tokens</label>
            </div>
        </div>
    </div>
    
    <!-- Actions Dropdown -->
    <div id="actionsMenu" class="dropdown-menu">
        <!-- Auth Item Removed -->
        <div class="menu-separator"></div>
        <button class="menu-item" id="menuThemeBtn">Theme</button>
        <div class="menu-separator"></div>
        <!-- Analytics Toggle Removed -->
        <div class="menu-separator"></div>
        <button class="menu-item" id="menuPrivacyBtn">Privacy Policy</button>
        <button class="menu-item" id="menuContactBtn">Contact</button>
        <button class="menu-item" id="menuDonateBtn">Donate</button>
        
        <div class="menu-separator"></div>
        <div id="versionDisplay" class="version-label" style="text-align: center; padding: 4px; opacity: 0.5;">v...</div>
    </div>
    
    <!-- Filter Sheet -->
    <div id="filterOverlay" class="overlay"></div>
    <div id="filterSheet" class="bottom-sheet">
        <div class="sheet-header">
            <button id="clearFilterBtn" class="action-btn-text" style="visibility: hidden;">Clear</button>
            <span class="sheet-title">Filters</span>
            <button id="closeFilterBtn" class="action-btn">Done</button>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <!-- Min Length Input -->
            <!-- Min Length Input -->
            <div class="text-field" style="flex: 1;">
                <input type="number" id="minLenInput" placeholder=" " min="0">
                <label for="minLenInput">Min Length</label>
            </div>

            <!-- Sort Toggle Button -->
            <button id="sortToggleBtn" class="icon-btn" title="Sort Order: Original">
                <div id="sortIcon" class="svg-icon icon-arrow-indeterminate"></div>
            </button>
        </div>
    </div>

    <div class="content-viewport">
        <!-- Page Loader Moved Here -->
        <div id="pageLoader" class="page-loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading...</div>
        </div>

        <div id="platformList" class="platform-list hidden">
            <div class="platform-item" data-url="https://chatgpt.com/" title="Open ChatGPT">
                <img src="../../assets/platforms/favicon_chatgpt.webp" alt="ChatGPT">
            </div>
            <div class="platform-item" data-url="https://claude.ai/" title="Open Claude">
                <img src="../../assets/platforms/favicon_claude.webp" alt="Claude">
            </div>
            <div class="platform-item" data-url="https://gemini.google.com/" title="Open Gemini">
                <img src="../../assets/platforms/favicon_gemini.webp" alt="Gemini">
            </div>
            <div class="platform-item" data-url="https://grok.com/" title="Open Grok">
                <img src="../../assets/platforms/favicon_grok.webp" alt="Grok">
            </div>
        </div>

        <div id="messageList" class="message-list">
          <div id="emptyState" class="empty-state">No messages extracted yet.</div>
        </div>
    </div>
    
    <!-- Login Screen REMOVED -->
    <!-- Privacy Sheet -->
    <div id="privacySheet" class="bottom-sheet">
        <div class="sheet-header">
            <div style="width: 36px;"></div> <!-- Spacer -->
            <span class="sheet-title">Privacy Policy</span>
            <button id="closePrivacyBtn" class="action-btn">Done</button>
        </div>
        <div id="privacyContent" class="markdown-content" style="max-height: 300px; overflow-y: auto;">
            Loading...
        </div>
    </div>

    <!-- Contact Sheet -->
    <div id="contactSheet" class="bottom-sheet">
        <div class="sheet-header">
            <div style="width: 36px;"></div>
            <span class="sheet-title">Contact</span>
            <button id="closeContactBtn" class="action-btn">Close</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <div class="text-field">
                 <select id="contactSubject" class="select-input">
                    <option value="Bug / Error Report">Bug / Error Report</option>
                    <option value="Feature Requests">Feature Requests</option>
                    <option value="General Support">General Support</option>
                </select>
                <label for="contactSubject" style="top: 8px; font-size: 10px;">Subject</label>
                <!-- Custom Arrow -->
                <div class="svg-icon icon-arrow-down" style="position: absolute; right: 12px; top: 18px; pointer-events: none; opacity: 0.5;"></div>
            </div>
            
             <button id="sendEmailBtn" class="action-btn" style="background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); justify-content: center; width: 100%; margin-top: 8px;">
                Send Email
            </button>
        </div>
    </div>

    <!-- Donate Sheet -->
    <div id="donateSheet" class="bottom-sheet">
        <div class="sheet-header">
            <div style="width: 36px;"></div>
            <span class="sheet-title">Donate</span>
            <button id="closeDonateBtn" class="action-btn">Close</button>
        </div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 16px; padding: 16px 0;">
            <div style="font-size: 48px;">☕</div>
            <div style="color: var(--md-sys-color-on-surface-variant);">
                Support the development of Keimenon Lite.
            </div>
            <button id="confirmDonateBtn" class="action-btn" style="background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); justify-content: center; width: 100%;">
                Buy me a Coffee
            </button>
        </div>
    </div>
    
    <!-- Theme Sheet -->
    <div id="themeSheet" class="bottom-sheet">
        <div class="sheet-header">
            <div style="width: 36px;"></div>
            <span class="sheet-title">Appearance</span>
            <button id="closeThemeBtn" class="action-btn">Done</button>
        </div>
        <div id="themeSelectGrid">
             <button class="theme-option-btn" data-theme="solid-dark">Solid Dark</button>
             <button class="theme-option-btn" data-theme="solid-light">Solid Light</button>
             <button class="theme-option-btn" data-theme="glass-dark">Glass Dark</button>
             <button class="theme-option-btn" data-theme="glass-light">Glass Light</button>
             <button class="theme-option-btn" data-theme="neu-dark">Neu Dark</button>
             <button class="theme-option-btn" data-theme="neu-light">Neu Light</button>
             <button class="theme-option-btn" data-theme="neon-dark">Neon Dark</button>
             <button class="theme-option-btn" data-theme="neon-light">Neon Light</button>
             <button class="theme-option-btn" data-theme="retro-dark">Retro Dark</button>
             <button class="theme-option-btn" data-theme="retro-light">Retro Light</button>
             <button class="theme-option-btn" data-theme="outline-dark">Outline Dark</button>
             <button class="theme-option-btn" data-theme="outline-light">Outline Light</button>
        </div>
    </div>
    
  </div>
  <!-- Mock Injection for Dev Preview -->
  <!-- Mock Injection moved to sidepanel.js -->
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
