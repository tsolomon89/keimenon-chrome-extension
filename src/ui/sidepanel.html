<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keimenon Lite</title>
  <link rel="icon" href="../../icons/icon16.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">

    <div class="header-group" id="headerGroup">
        <div class="scan-line"></div>
        
        <!-- Row 1: Title & Status -->
        <div class="top-bar">
          <div id="statusBadge" class="status-badge">Ready</div>
          <div id="versionDisplay" class="version-label">v...</div>
        </div>

        <!-- Row 2: Control Icons -->
        <div class="controls-row">
             <!-- Scan -->
             <button id="quickScanBtn" class="icon-btn" title="Scan Full Chat" style="display: none;">
                 <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M72.59-921.828v-5.582h5.582v2.345H74.934v3.238Zm19.51,0v-3.238H88.862v-2.345h5.582v5.582ZM72.59-903.41v-5.582h2.344v3.238h3.238v2.344Zm16.272,0v-2.344H92.1v-3.238h2.344v5.582Zm-10.51-5.762H88.683v-12.477H78.352Zm0,2.441a2.348,2.348,0,0,1-1.721-.72,2.348,2.348,0,0,1-.72-1.721v-12.477a2.348,2.348,0,0,1,.72-1.721,2.348,2.348,0,0,1,1.721-.72H88.683a2.348,2.348,0,0,1,1.721.72,2.348,2.348,0,0,1,.72,1.721v12.477a2.348,2.348,0,0,1-.72,1.721,2.348,2.348,0,0,1-1.721.72Zm1.909-10.786h6.514v-2.222H80.26Zm0,3.219h6.514v-2.222H80.26Zm0,3.218h6.514V-913.3H80.26Zm-1.909,1.909v0Z" transform="translate(-71.633 927.41)"/>
                 </svg>
             </button>

             <!-- Refresh -->
             <button id="quickRefreshBtn" class="icon-btn" title="Refresh Page">
                 <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M160.91-788.13a9.648,9.648,0,0,1-7.089-2.911,9.648,9.648,0,0,1-2.911-7.089,9.648,9.648,0,0,1,2.911-7.089,9.648,9.648,0,0,1,7.089-2.911,9.918,9.918,0,0,1,4.136.891,9.423,9.423,0,0,1,3.368,2.557v-3.447h2.555v8.89h-8.9v-2.548h5.076a7.119,7.119,0,0,0-2.634-2.616,7.108,7.108,0,0,0-3.6-.953,6.969,6.969,0,0,0-5.119,2.108,6.969,6.969,0,0,0-2.108,5.119,6.97,6.97,0,0,0,2.108,5.119,6.969,6.969,0,0,0,5.119,2.107,7.045,7.045,0,0,0,4.167-1.319,7.071,7.071,0,0,0,2.633-3.47h2.9a9.887,9.887,0,0,1-3.554,5.447A9.687,9.687,0,0,1,160.91-788.13Z" transform="translate(-148.952 810.13)"/>
                 </svg>
             </button>

             <div style="flex: 1;"></div>

             <!-- Copy -->
             <button id="copyAllBtn" class="icon-btn" title="Copy Selected">
                 <svg viewBox="0 0 24 25" width="20" height="20" fill="currentColor">
                     <path d="M113.991-874.541a2.552,2.552,0,0,1-1.873-.774,2.551,2.551,0,0,1-.774-1.873v-13.8a2.551,2.551,0,0,1,.774-1.873,2.551,2.551,0,0,1,1.873-.774h10.3a2.551,2.551,0,0,1,1.873.774,2.551,2.551,0,0,1,.774,1.873v13.8a2.551,2.551,0,0,1-.774,1.873,2.552,2.552,0,0,1-1.873.774Zm0-2.647h10.3v-13.8h-10.3Zm-4.974,7.621a2.551,2.551,0,0,1-1.873-.774,2.551,2.551,0,0,1-.774-1.873v-16.442h2.647v16.442h12.952v2.647Zm4.974-7.621v0Z" transform="translate(-104.364 893.63)"/>
                 </svg>
             </button>

             <!-- Filters -->
             <button id="filterBtn" class="icon-btn" title="Filters">
                 <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                     <path d="M124.188-825.41v-7.407h2.617v2.4h9.581v2.617h-9.581v2.4Zm-9.688-2.4v-2.617h7.407v2.617Zm4.79-4.9v-2.4H114.5v-2.61h4.79v-2.4h2.617v7.4Zm4.9-2.4v-2.61h12.2v2.61Zm4.79-4.9v-7.407H131.6v2.4h4.79v2.617H131.6v2.4ZM114.5-842.4v-2.617h12.2v2.617Z" transform="translate(-113.621 848.215)"/>
                 </svg>
             </button>

             <!-- Menu -->
             <button id="menuBtn" class="icon-btn" title="More Options">⋮</button>
        </div>

        <div id="scanProgress" class="scan-progress" style="display: none;">
            <div class="scan-progress-text">
                <div class="scan-dot"></div>
                <span>Scanning... <span id="scanLog"></span></span>
            </div>
            <button id="stopScanBtn" class="action-btn-small">Stop</button>
        </div>

        <!-- Row 3: Search -->
        <div class="search-row">
          <input type="text" id="searchInput" class="search-input" placeholder="Search prompts...">
        </div>

        <!-- Row 4: Stats Grid -->
        <div id="statsGrid" class="stats-grid">
            <div class="stat-pill" title="Character Count">
                <span class="stat-label">CHARS</span>
                <span id="statCharsVal">0</span>
            </div>
            <div class="stat-pill" title="Token Count">
                <span class="stat-label">TOKENS</span>
                <span id="statTokensVal">0</span>
            </div>
            <!-- Selected Pill (now Select All Controller) -->
            <div class="stat-pill clickable" id="selectAllBtn" title="Select/Deselect All">
                <svg id="selectAllIcon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="margin-right:4px">
                    <!-- icon_check_box_outline_blank (Initial State) -->
                    <path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
                <span id="selectedCountValue">0</span>
            </div>
             <!-- Hidden Toggle Pill -->
            <div class="stat-pill clickable" id="showHiddenBtn" title="Toggle Hidden Messages">
                 <svg id="showHiddenIcon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="margin-right:4px">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                 </svg>
                 <span id="hiddenCount">0</span>
            </div>
        </div>
    </div>
    
    <!-- Actions Dropdown -->
    <div id="actionsMenu" class="dropdown-menu">
        <button class="menu-item" id="menuAuthAction">Sign Out</button>
        <div style="border-top: 1px solid var(--md-sys-color-outline-variant); margin: 4px 0; opacity: 0.2;"></div>
        <label class="menu-item" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="analyticsToggle" checked> 
            <span style="flex: 1">Analytics</span>
        </label>
    </div>
    
    <!-- Filter Sheet -->
    <div id="filterOverlay" class="sheet-overlay"></div>
    <div id="filterSheet" class="bottom-sheet">
        <div class="sheet-header">
            <span class="sheet-title">Filters</span>
            <button id="closeFilterBtn" class="action-btn">Done</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <label>
                Minimum Character Length:
                <input type="number" id="minLenInput" value="0" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid var(--md-sys-color-outline); border-radius: 4px;">
            </label>
            
            <div style="display: flex; gap: 8px; align-items: center;">
                <span>Sort By:</span>
                <select id="sortSelect" style="padding: 8px; flex: 1; border-radius: 4px;">
                    <option value="original">Original Order</option>
                    <option value="lengthDesc">Length (Longest First)</option>
                    <option value="lengthAsc">Length (Shortest First)</option>
                </select>
            </div>
        </div>
    </div>

    <div id="messageList" class="message-list">
      <div class="empty-state">No messages extracted yet.</div>
    </div>
    
    <div id="loginScreen" class="login-screen hidden">
        <div class="login-icon">K</div>
        <div class="title" style="margin-bottom: 8px;">Welcome to Keimenon</div>
        <div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">
            Sign in to start extracting prompts.
        </div>
        <button id="googleSignInBtn" class="google-btn">
            Sign in with Google
        </button>
    </div>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
