<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keimenon Lite</title>
  <link rel="icon" href="../../icons/icon16.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">

    <div class="header-group" id="headerGroup">
        <div class="scan-line"></div>
        <div class="top-bar">
          <div class="title">Keimenon Lite</div>
           <div style="display: flex; align-items: center; gap: 4px;">
              <div id="statusBadge" class="status-badge" style="margin-right: 4px;">Ready</div>
              
              <button id="quickScanBtn" class="menu-btn" title="Scan Full Chat" style="display: none;">
                  <!-- Radar/Scan Icon -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
              </button>
              
              <button id="quickRefreshBtn" class="menu-btn" title="Refresh Page">
                 <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              </button>

              <button id="menuBtn" class="menu-btn" title="More Options">⋮</button>
           </div>
        </div>

        <div id="scanProgress" class="scan-progress" style="display: none;">
            <div class="scan-progress-text">
                <div class="scan-dot"></div>
                <span>Scanning... <span id="scanLog"></span></span>
            </div>
            <button id="stopScanBtn" class="action-btn" style="font-size: 10px; height: 24px; padding: 0 10px;">Stop</button>
        </div>

        <div class="controls">
          <input type="text" id="searchInput" class="search-input" placeholder="Search prompts...">
          <button id="filterBtn" class="action-btn">Filters</button>
          <button id="copyAllBtn" class="action-btn primary">Copy All</button>
        </div>
    </div>

    <!-- Actions Dropdown -->
    <div id="actionsMenu" class="dropdown-menu">
        <!-- Moved Refresh/Scan to header -->
        <button class="menu-item" id="menuAuthAction">Sign Out</button>
        <div style="border-top: 1px solid var(--md-sys-color-outline-variant); margin: 4px 0; opacity: 0.2;"></div>
        <label class="menu-item" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="analyticsToggle" checked> 
            <span style="flex: 1">Analytics</span>
        </label>
    </div>
    
    <!-- Filter Sheet -->
    <div id="filterOverlay" class="sheet-overlay"></div>
    <div id="filterSheet" class="bottom-sheet">
        <div class="sheet-header">
            <span class="sheet-title">Filters</span>
            <button id="closeFilterBtn" class="action-btn">Done</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <label>
                Minimum Character Length:
                <input type="number" id="minLenInput" value="0" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid var(--md-sys-color-outline); border-radius: 4px;">
            </label>
            
            <div style="display: flex; gap: 8px; align-items: center;">
                <span>Sort By:</span>
                <select id="sortSelect" style="padding: 8px; flex: 1; border-radius: 4px;">
                    <option value="original">Original Order</option>
                    <option value="lengthDesc">Length (Longest First)</option>
                    <option value="lengthAsc">Length (Shortest First)</option>
                </select>
            </div>
        </div>
    </div>

    <div id="messageList" class="message-list">
      <div class="empty-state">No messages extracted yet.</div>
    </div>
    
    <div id="loginScreen" class="login-screen hidden">
        <div class="login-icon">K</div>
        <div class="title" style="margin-bottom: 8px;">Welcome to Keimenon</div>
        <div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">
            Sign in to start extracting prompts.
        </div>
        <button id="googleSignInBtn" class="google-btn">
            Sign in with Google
        </button>
    </div>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
