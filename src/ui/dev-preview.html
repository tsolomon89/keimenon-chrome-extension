<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keimenon Lite (Preview)</title>
  <link rel="icon" href="../../assets/icons/icon16.png">
  <link rel="stylesheet" href="styles.css">
  <style>
      body { 
          margin: 0; 
          overflow: hidden; 
          background: #333; 
          font-family: sans-serif;
      }
      .split-layout {
          display: flex;
          height: 100vh;
          width: 100vw;
      }
      .mock-browser {
          flex: 1;
          background: #222;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #666;
          flex-direction: column;
      }
      .resize-handle {
          width: 5px;
          background: #444;
          cursor: col-resize;
          transition: background 0.2s;
          position: relative;
          z-index: 10;
      }
      .resize-handle:hover, .resize-handle.dragging {
          background: #005ac1;
      }
      /* Override app container for preview */
      .app-container {
          width: 450px; /* Standard comfortable sidebar width */
          min-width: 300px;
          max-width: 90vw;
          height: 100%;
          border-left: 1px solid var(--glass-border); 
          /* Reset previous */
          margin: 0;
          border-radius: 0; 
          display: flex;
          flex-direction: column;
          
          /* IMPORTANT: Since this is a div, not body, we must re-apply the base theme background/color 
             that styles.css normally puts on body. */
          background-color: var(--md-sys-color-surface);
          color: var(--md-sys-color-on-surface);
          
          box-shadow: -5px 0 20px rgba(0,0,0,0.3);
      }
  </style>
</head>
<body>
  <div class="split-layout">
      <div id="debug-status" style="position:fixed; top:0; left:0; background:rgba(255,0,0,0.8); color:white; padding:5px; z-index:9999; pointer-events:none;">Debug: INIT</div>
      <!-- Mock Browser Content -->
      <div class="mock-browser">
          <iframe id="mockBrowserFrame" src="mocks/chatgpt-mock.html" style="width:100%; height:100%; border:none;"></iframe>
      </div>

      <!-- Drag Handle -->
      <div class="resize-handle" id="resizeHandle"></div>

      <!-- Side Panel App -->
      <div class ="app-container" id="appContainer">
         <iframe id="sidepanelFrame" style="width: 100%; height: 100%; border: none;"></iframe>
      </div> <!-- End App Container -->
  </div> <!-- End Split Layout -->
  
  <script type="module" src="dev-mocks.js"></script>
  <!-- sidepanel.js is now loaded by the iframe -->
  
  <!-- Resize Logic -->
  <script src="dev-preview-init.js"></script>
</body>
</html>
